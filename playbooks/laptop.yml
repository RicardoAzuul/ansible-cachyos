---
- name: Configure CachyOS laptop
  hosts: cachyos_laptop
  gather_facts: true
  vars_files:
    - ../vars/packages.yml

  tasks:
    - name: Install official CachyOS packages
      become: true
      community.general.pacman:
        update_cache: true
        name: "{{ cachyos_pacman_packages }}"
        state: present

    - name: Configure pacman for automated operation
      become: true
      ansible.builtin.lineinfile:
        path: /etc/pacman.conf
        regexp: "{{ item.regexp }}"
        line: "{{ item.line }}"
      loop:
        - { regexp: '^#?Color', line: 'Color' }
        - { regexp: '^#?ParallelDownloads', line: 'ParallelDownloads = 5' }
        - { regexp: '^#?VerbosePkgLists', line: 'VerbosePkgLists' }

    - name: Enable multilib repository
      become: true
      ansible.builtin.blockinfile:
        path: /etc/pacman.conf
        marker: "# {mark} ANSIBLE MANAGED - multilib"
        block: |
          [multilib]
          Include = /etc/pacman.d/mirrorlist

    - name: Check whether paru is available
      ansible.builtin.stat:
        path: /usr/bin/paru
      register: paru_binary

    - name: Fail when paru is missing
      ansible.builtin.fail:
        msg: paru is required to install AUR packages on CachyOS.
      when: not paru_binary.stat.exists

    - name: Install AUR packages with paru
      community.general.pacman:
        executable: paru
        extra_args: --noconfirm --needed
        name: "{{ cachyos_aur_packages }}"
        state: present

    - name: Check whether Homebrew is available
      ansible.builtin.stat:
        path: /home/linuxbrew/.linuxbrew/bin/brew
      register: brew_binary

    - name: Install Homebrew
      ansible.builtin.shell:
        cmd: NONINTERACTIVE=1 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
        creates: /home/linuxbrew/.linuxbrew/bin/brew
      register: homebrew_install
      when: not brew_binary.stat.exists

    - name: Verify Homebrew binary is present after installation
      ansible.builtin.stat:
        path: /home/linuxbrew/.linuxbrew/bin/brew
      register: brew_binary_check

    - name: Fail when Homebrew installation did not produce a brew binary
      ansible.builtin.fail:
        msg: Homebrew installation failed. The brew binary was not found at /home/linuxbrew/.linuxbrew/bin/brew.
      when: not brew_binary_check.stat.exists

    - name: Tap hashicorp/tap Homebrew repository
      community.general.homebrew_tap:
        name: hashicorp/tap
        path: /home/linuxbrew/.linuxbrew/bin

    - name: Install Vagrant via Homebrew
      community.general.homebrew:
        name: hashicorp/tap/vagrant
        state: present
        path: /home/linuxbrew/.linuxbrew/bin
