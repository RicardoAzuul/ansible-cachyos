---
- name: Configure CachyOS laptop
  hosts: cachyos_laptop
  gather_facts: true
  vars_files:
    - ../vars/packages.yml

  tasks:
    - name: Install official CachyOS packages
      become: true
      community.general.pacman:
        update_cache: true
        name: "{{ cachyos_pacman_packages }}"
        state: present

    - name: Create AUR builder user
      become: true
      ansible.builtin.user:
        name: aurbuilder
        groups: wheel
        create_home: true

    - name: Allow aurbuilder to use pacman and paru without password
      become: true
      ansible.builtin.copy:
        dest: /etc/sudoers.d/11-aurbuilder
        content: |
          aurbuilder ALL=(ALL) NOPASSWD: /usr/bin/pacman
          aurbuilder ALL=(ALL) NOPASSWD: /usr/bin/paru
        mode: '0440'
        validate: 'visudo -cf %s'

    - name: Check if paru is installed
      ansible.builtin.command: which paru
      register: paru_check
      changed_when: false
      failed_when: false

    - name: Install paru AUR helper
      when: paru_check.rc != 0
      become: true
      become_user: aurbuilder
      block:
        - name: Clone paru repository
          ansible.builtin.git:
            repo: https://aur.archlinux.org/paru.git
            dest: /tmp/paru-bin
            update: false

        - name: Build and install paru
          ansible.builtin.command: makepkg -si --noconfirm
          args:
            chdir: /tmp/paru-bin
          changed_when: true

    - name: Install AUR packages with paru
      become: true
      become_user: aurbuilder
      kewlfft.aur.aur:
        name: "{{ cachyos_aur_packages }}"
        use: paru
        state: present


    - name: Check whether Homebrew is available
      ansible.builtin.stat:
        path: /home/linuxbrew/.linuxbrew/bin/brew
      register: brew_binary

    - name: Install Homebrew
      ansible.builtin.shell:
        cmd: NONINTERACTIVE=1 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
        creates: /home/linuxbrew/.linuxbrew/bin/brew
      register: homebrew_install
      when: not brew_binary.stat.exists

    - name: Verify Homebrew binary is present after installation
      ansible.builtin.stat:
        path: /home/linuxbrew/.linuxbrew/bin/brew
      register: brew_binary_check

    - name: Fail when Homebrew installation did not produce a brew binary
      ansible.builtin.fail:
        msg: Homebrew installation failed. The brew binary was not found at /home/linuxbrew/.linuxbrew/bin/brew.
      when: not brew_binary_check.stat.exists

    - name: Tap hashicorp/tap Homebrew repository
      community.general.homebrew_tap:
        name: hashicorp/tap
        path: /home/linuxbrew/.linuxbrew/bin

    - name: Install Vagrant via Homebrew
      community.general.homebrew:
        name: hashicorp/tap/vagrant
        state: present
        path: /home/linuxbrew/.linuxbrew/bin
