---
- name: Configure CachyOS laptop
  hosts: cachyos_laptop
  gather_facts: true
  vars_files:
    - ../vars/packages.yml

  tasks:
    - name: Install official CachyOS packages
      become: true
      community.general.pacman:
        update_cache: true
        name: "{{ cachyos_pacman_packages }}"
        state: present

    - name: Create AUR builder user
      become: true
      ansible.builtin.user:
        name: aurbuilder
        groups: wheel
        create_home: true

    - name: Allow aurbuilder to use pacman and paru without password
      become: true
      ansible.builtin.copy:
        dest: /etc/sudoers.d/11-aurbuilder
        content: |
          aurbuilder ALL=(ALL) NOPASSWD: /usr/bin/pacman
          aurbuilder ALL=(ALL) NOPASSWD: /usr/bin/paru
        mode: '0440'
        validate: 'visudo -cf %s'

    - name: Check if paru is installed
      ansible.builtin.command: which paru
      register: paru_check
      changed_when: false
      failed_when: false

    - name: Install paru AUR helper
      when: paru_check.rc != 0
      become: true
      become_user: aurbuilder
      block:
        - name: Clone paru repository
          ansible.builtin.git: # noqa: git-latest
            repo: https://aur.archlinux.org/paru.git
            dest: /tmp/paru-bin
            update: false

        - name: Build and install paru
          ansible.builtin.command: makepkg -si --noconfirm
          args:
            chdir: /tmp/paru-bin
          changed_when: true

    - name: Install AUR packages with paru
      become: true
      become_user: aurbuilder
      kewlfft.aur.aur:
        name: "{{ cachyos_aur_packages }}"
        use: paru
        state: present

    - name: Ensure ~/.config/systemd/user exists for rclone service
      ansible.builtin.file:
        path: "{{ ansible_user_dir }}/.config/systemd/user"
        state: directory
        mode: '0755'

    - name: Copy rclone mount user service
      ansible.builtin.copy:
        src: rclone@googledrive.service
        dest: "{{ ansible_user_dir }}/.config/systemd/user/rclone@googledrive.service"
        mode: '0644'
      notify: Reload systemd user daemon

    - name: Ensure ~/GoogleDrive exists for rclone
      ansible.builtin.file:
        path: "{{ ansible_user_dir }}/GoogleDrive"
        state: directory
        mode: '0755'

    - name: Ensure ~/opt exists for Espanso AppImage
      ansible.builtin.file:
        path: "{{ ansible_user_dir }}/opt"
        state: directory
        mode: '0755'

    - name: Download Espanso AppImage
      ansible.builtin.get_url:
        url: https://github.com/espanso/espanso/releases/latest/download/Espanso-wayland.AppImage
        dest: "{{ ansible_user_dir }}/opt/Espanso.AppImage"
        mode: '0755'
        force: false

    - name: Register Espanso command alias
      become: true
      ansible.builtin.command: "{{ ansible_user_dir }}/opt/Espanso.AppImage env-path register"
      args:
        creates: /usr/local/bin/espanso

    - name: Register Espanso systemd user service
      ansible.builtin.command: /usr/local/bin/espanso service register
      args:
        creates: "{{ ansible_user_dir }}/.config/systemd/user/espanso.service"

    - name: Start Espanso
      ansible.builtin.command: /usr/local/bin/espanso start
      register: espanso_start
      changed_when: "'already running' not in (((espanso_start.stdout | default('')) ~ (espanso_start.stderr | default(''))) | lower)"
      failed_when:
        - espanso_start.rc != 0
        - "'already running' not in (((espanso_start.stdout | default('')) ~ (espanso_start.stderr | default(''))) | lower)"

  handlers:
    - name: Reload systemd user daemon
      ansible.builtin.systemd:
        daemon_reload: true
        scope: user
